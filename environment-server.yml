name: elc-rl-server
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch::pytorch=2.5.1=*cuda*
  - pytorch::pytorch-cuda=12.1
  - numba=0.66.0
  - numpy=2.4
  - scipy=1.17
  - cloudpickle>=3.0,<4
  - control=0.10.2
  - gymnasium=1.2.3
  - matplotlib>=3.9,<4
  - stable-baselines3=2.9.0
  - tensorboard=2.20.0
