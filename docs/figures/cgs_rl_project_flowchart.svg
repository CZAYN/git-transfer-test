  <text x="1652" y="323" text-anchor="middle" class="node-title-small">训练 / 验证模型完整安全审计</text>
  <text x="1652" y="351" text-anchor="middle" class="node-subtitle">40 个训练 + 16 个验证</text>
  <text x="1652" y="431" text-anchor="middle" class="node-title-small">仅保留安全候选</text>
