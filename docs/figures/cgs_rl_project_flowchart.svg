  <text x="618" y="348" text-anchor="middle" class="minor">频域、时域与安全评价</text>
  <text x="618" y="367" text-anchor="middle" class="minor">训练阶段与可调参数</text>

  <circle cx="790" cy="327" r="24" fill="#FFE0BC"/>
  <path d="M779 327 H801 M790 316 V338 M782 319 L798 335 M798 319 L782 335" stroke="#DD6B20" stroke-width="2.8" stroke-linecap="round"/>
