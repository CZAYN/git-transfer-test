  <circle cx="118" cy="390" r="27" fill="#D7EAFE"/>
  <path d="M98 392 H138 M105 379 L98 392 L105 405 M131 379 L138 392 L131 405" fill="none" stroke="#2B6CB0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
