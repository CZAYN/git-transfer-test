  <!-- Project configuration and model parameters -->
  <circle cx="118" cy="236" r="25" fill="#D7EAFE"/>
  <path d="M103 226 H133 M103 236 H133 M103 246 H133" stroke="#2B6CB0" stroke-width="3.5" stroke-linecap="round"/>
