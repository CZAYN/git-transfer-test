  <path d="M920 772 H960" class="arrow-green"/>
  <path d="M1110 815 V832 H825 V850" class="arrow-green"/>
  <path d="M975 882 H1010" class="arrow-orange"/>
  <path d="M1330 882 H1380 V260 H822 V280" class="arrow-orange-loop"/>
