  <path d="M1652 372 V397" class="arrow-green"/>
  <path d="M1652 479 V504" class="arrow-green"/>
  <path d="M1652 586 V625" class="arrow-green"/>
  <path d="M1652 713 V748" class="arrow-green"/>
  <path d="M1652 813 V832 H1542 V850" class="arrow-green"/>
  <path d="M1652 813 V832 H1760 V850" class="arrow-red"/>
  <text x="1567" y="829" text-anchor="middle" class="arrow-label">通过</text>
  <text x="1745" y="829" text-anchor="middle" class="arrow-label" fill="#C53030">未通过</text>

  <!-- Physical modeling nodes -->
  <g filter="url(#shadow)">
    <rect x="70" y="195" width="360" height="82" rx="17" class="node-blue"/>
    <rect x="70" y="340" width="360" height="100" rx="18" class="node-blue"/>
    <rect x="70" y="485" width="360" height="100" rx="18" class="node-blue"/>
    <rect x="70" y="650" width="360" height="100" rx="18" class="node-blue"/>
    <rect x="70" y="795" width="360" height="105" rx="18" class="node-blue"/>
