<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">CGS转台三环PIDF与DOBC强化学习调参全流程</title>
  <desc id="desc">项目通用框架图。左侧为数学物理模型、参数不确定性和物理模型集合，中间为五阶段SAC强化学习训练闭环，右侧为候选选择、独立最终测试以及通过或失败后的后续流程。</desc>

  <defs>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#19324D" flood-opacity="0.11"/>
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2B6CB0"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#DD6B20"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2F855A"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6B46C1"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C53030"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52667A"/>
    </marker>

    <style>
      text {
        font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", "Segoe UI", sans-serif;
        fill: #18324B;
      }
      .title { font-size: 41px; font-weight: 700; letter-spacing: 0.5px; }
      .section-title { font-size: 24px; font-weight: 700; fill: #FFFFFF; }
      .node-title { font-size: 22px; font-weight: 700; }
      .node-title-small { font-size: 19px; font-weight: 700; }
      .node-subtitle { font-size: 16px; font-weight: 500; fill: #52667A; }
      .minor { font-size: 14px; font-weight: 600; fill: #52667A; }
      .note { font-size: 20px; font-weight: 700; fill: #334E68; }
      .arrow-label { font-size: 14px; font-weight: 700; fill: #52667A; }
      .panel { fill: #FFFFFF; stroke: #D8E3ED; stroke-width: 2; }
      .node-blue { fill: #EDF6FF; stroke: #2B6CB0; stroke-width: 2.5; }
      .node-orange { fill: #FFF4E6; stroke: #DD6B20; stroke-width: 2.5; }
      .node-green { fill: #EBFAF2; stroke: #2F855A; stroke-width: 2.5; }
      .node-purple { fill: #F4F0FF; stroke: #6B46C1; stroke-width: 2.5; }
      .node-red { fill: #FFF5F5; stroke: #C53030; stroke-width: 2.5; }
      .soft-orange { fill: #FFF8EF; stroke: #E79A59; stroke-width: 2; }
      .arrow-blue { fill: none; stroke: #2B6CB0; stroke-width: 3.5; marker-end: url(#arrow-blue); }
      .arrow-orange { fill: none; stroke: #DD6B20; stroke-width: 3.5; marker-end: url(#arrow-orange); }
      .arrow-orange-loop { fill: none; stroke: #DD6B20; stroke-width: 3.5; stroke-dasharray: 9 7; marker-end: url(#arrow-orange); }
      .arrow-green { fill: none; stroke: #2F855A; stroke-width: 3.5; marker-end: url(#arrow-green); }
      .arrow-purple { fill: none; stroke: #6B46C1; stroke-width: 3.5; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
      .arrow-red { fill: none; stroke: #C53030; stroke-width: 3.5; marker-end: url(#arrow-red); }
      .arrow-gray { fill: none; stroke: #52667A; stroke-width: 3.2; marker-end: url(#arrow-gray); }
      .arrow-gray-loop { fill: none; stroke: #52667A; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow-gray); }
      .line-green { fill: none; stroke: #2F855A; stroke-width: 3.2; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1920" height="1080" fill="#F6F9FC"/>
  <rect x="0" y="0" width="1920" height="92" fill="#FFFFFF"/>
  <line x1="40" y1="92" x2="1880" y2="92" stroke="#D8E3ED" stroke-width="2"/>
  <text x="960" y="60" text-anchor="middle" class="title">CGS转台三环 PIDF + DOBC 强化学习调参全流程</text>

