  <circle cx="118" cy="848" r="27" fill="#D7EAFE"/>
  <path d="M99 846 C108 820 118 872 128 836 C136 823 143 855 149 842" fill="none" stroke="#2B6CB0" stroke-width="3.5" stroke-linecap="round"/>
  <text x="286" y="832" text-anchor="middle" class="node-title">Episode 抽样物理模型</text>
  <text x="286" y="864" text-anchor="middle" class="node-subtitle">完整参数实例进入仿真</text>

  <!-- Five-stage curriculum ribbon -->
  <rect x="520" y="190" width="845" height="55" rx="18" class="soft-orange"/>
  <text x="942" y="225" text-anchor="middle" class="node-title-small">五阶段课程：电流环 → 速度环 → 位置环 → DOBC → 联合微调</text>

