  <circle cx="118" cy="700" r="27" fill="#D7EAFE"/>
  <rect x="96" y="685" width="42" height="28" rx="4" fill="#FFFFFF" stroke="#8AB9EA" stroke-width="2"/>
  <rect x="102" y="691" width="42" height="28" rx="4" fill="#FFFFFF" stroke="#5B9DDE" stroke-width="2"/>
