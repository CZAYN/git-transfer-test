    <rect x="490" y="115" width="905" height="825" rx="24" class="panel"/>
    <rect x="1420" y="115" width="465" height="825" rx="24" class="panel"/>
  </g>

  <path d="M59 115 H441 Q465 115 465 139 V172 H35 V139 Q35 115 59 115 Z" fill="#2B6CB0"/>
  <path d="M514 115 H1371 Q1395 115 1395 139 V172 H490 V139 Q490 115 514 115 Z" fill="#C65D12"/>
  <path d="M1444 115 H1861 Q1885 115 1885 139 V172 H1420 V139 Q1420 115 1444 115 Z" fill="#2F855A"/>
  <text x="250" y="153" text-anchor="middle" class="section-title">物理建模与模型集合</text>
  <text x="942" y="153" text-anchor="middle" class="section-title">五阶段 SAC 强化学习训练</text>
  <text x="1652" y="153" text-anchor="middle" class="section-title">候选选择与独立测试</text>

