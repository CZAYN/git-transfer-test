  <path d="M250 277 V340" class="arrow-blue"/>
  <path d="M250 440 V485" class="arrow-blue"/>
  <path d="M250 585 V650" class="arrow-blue"/>
  <path d="M250 750 V795" class="arrow-blue"/>

